name: CD

# Publishes the image to Docker Hub and triggers the host's deploy hook. Runs
# after CI passes on a push to main, not on the push itself: the image build
# skips the database tests, which only CI runs, and only green main commits
# are deployed (docs/DEPLOYMENT.md §5).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Serialize deploys: rapid pushes to main cancel the older run instead of
# colliding on the server-side deploy lock (409 "already running").
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      # The commit CI tested, which may be behind main by now.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Get short SHA
        id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/turnip-farm:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/turnip-farm:sha-${{ steps.sha.outputs.short }}

  deploy:
    needs: docker-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger deploy
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          SHA: ${{ needs.docker-push.outputs.sha }}
        run: |
          curl --fail-with-body -sS -X POST "$DEPLOY_URL" \
            -H "Authorization: Bearer $DEPLOY_SECRET" \
            -H "Content-Type: application/json" \
            -w '\n---\nstatus: %{http_code}, duration: %{time_total}s\n' \
            --data "{\"sha\":\"${SHA}\",\"repo\":\"${GITHUB_REPOSITORY}\"}"
