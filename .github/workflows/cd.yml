name: CD

# Publishes the image to Docker Hub and triggers the host's deploy hook. Runs
# after CI passes on a push to main, not on the push itself: the image build
# skips the database tests, which only CI runs, and only green main commits
# are deployed (docs/DEPLOYMENT.md §5).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Queue deploys rather than cancel them: every run deploys main's tip (see
# "Resolve main's tip"), so a queued run that replaces another loses
# nothing, and an in-progress deploy is never cut off. Runs never overlap,
# so they never collide on the server-side deploy lock (409 "already
# running").
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  docker-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      # CI runs for successive pushes can finish out of order, and the run
      # that triggered this one may be for a commit main has moved past, so
      # build main's tip instead, and only once CI has passed for it.
      # Otherwise do nothing: the tip's own CI run triggers CD again.
      - name: Resolve main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" --jq .total_count)
          if [ "$passed" -gt 0 ]; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "CI has not passed for main's tip $sha yet; its own CI run will deploy it."
          fi

      - if: steps.tip.outputs.sha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.tip.outputs.sha }}
          persist-credentials: false

      - if: steps.tip.outputs.sha != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.tip.outputs.sha != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - if: steps.tip.outputs.sha != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/turnip-farm:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/turnip-farm:sha-${{ steps.tip.outputs.short }}

  deploy:
    needs: docker-push
    if: needs.docker-push.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger deploy
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          SHA: ${{ needs.docker-push.outputs.sha }}
        run: |
          curl --fail-with-body -sS -X POST "$DEPLOY_URL" \
            -H "Authorization: Bearer $DEPLOY_SECRET" \
            -H "Content-Type: application/json" \
            -w '\n---\nstatus: %{http_code}, duration: %{time_total}s\n' \
            --data "{\"sha\":\"${SHA}\",\"repo\":\"${GITHUB_REPOSITORY}\"}"
