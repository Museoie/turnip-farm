name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR pushes — cancelling a push-to-main run can
  # leave a merged commit with a cancelled rather than green check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turnip
          POSTGRES_PASSWORD: turnip
          POSTGRES_DB: turnip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnip -d turnip"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://turnip:turnip@localhost:5432/turnip?sslmode=disable
      TEST_DATABASE_URL: postgres://turnip:turnip@localhost:5432/turnip?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Installs the Bun version pinned by `packageManager` in package.json.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Migrate
        run: bun run db:migrate

      # Migrations must be re-runnable (BACKEND_DESIGN.md §2): forget every
      # applied version, then apply them all again over the existing schema.
      - name: Re-run migrations
        run: |
          bun -e 'await Bun.sql`TRUNCATE schema_migrations`'
          bun run db:migrate

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
